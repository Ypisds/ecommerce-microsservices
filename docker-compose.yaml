services:
  produto_service:
    build: ./produto-service
    container_name: produto_container
    depends_on:
      produto_db:
        condition: service_healthy
    expose:
      - 8080
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://produto_db:5432/produto_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=${PRODUTO_DB_PASSWORD}
      - MINIO_URL=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}

  produto_db:
    image: postgres:18
    restart: always
    environment:
      - POSTGRES_PASSWORD=${PRODUTO_DB_PASSWORD}
      - POSTGRES_DB=produto_db
    volumes:
      - produto_db_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d produto_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - 5432
  
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: minio_storage
    restart: always
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  frontend:
    build:
      context: ./frontend
      target: development
    container_name: angular_app
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
  
  nginx:
    image: nginxinc/nginx-unprivileged:alpine3.22
    container_name: nginx_gateway
    restart: always
    ports:
      - "8000:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - produto_service

volumes:
  produto_db_data:
  minio_data: