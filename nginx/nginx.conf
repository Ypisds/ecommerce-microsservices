pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Mapeamento para tratar adequadamente o cabeçalho Upgrade
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream angular-app {
        server frontend:4200;
    }

    upstream produto-service {
        server produto_service:8080;
    }

    server {
        listen 8080;

        # Rota principal para o Frontend Angular
        location / {
            proxy_pass http://angular-app;
            
            # --- SUPORTE A WEBSOCKETS (LIVE RELOAD / HMR) ---
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            # Cabeçalhos padrão do Proxy
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Opcional: Aumenta o tempo de timeout para evitar desconexão de WebSockets ociosos
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Rota da API
        location /api/produtos/ {
            proxy_pass http://produto-service/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Prefix /api/produtos;
        }
    }
}