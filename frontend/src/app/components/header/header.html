<header class="w-full border-b border-gray-300">
    <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8">
        <div>
            <h2 class="font-serif text-2xl sm:text-3xl">Ecommerce</h2>
        </div>
        <div class="flex">
            <nav routerLink="" class="text-xl font-serif font-medium transition transform hover:scale-105 hover:cursor-grab mr-4">Home</nav>
            <nav routerLink="/products" class="text-xl font-serif font-medium transition transform hover:scale-105 hover:cursor-grab">Products</nav>
        </div>
        <div class="flex">
            <button class="hover:scale-105 hover:cursor-grab">
                <svg class="mr-4" lucideSearch [size]="30"></svg>
            </button>
    
            <button class="hover:scale-105 hover:cursor-grab">
                <svg class="mr-4" lucideHeart [size]="30"></svg>
            </button>
    
            <button class="hover:scale-105 hover:cursor-grab">
                <svg class="mr-4" lucideShoppingCart [size]="30"></svg>
            </button>
    
            <button class="hover:scale-105 hover:cursor-grab">
                <svg class="mr-4" lucideCircleUserRound [size]="30"></svg>
            </button>
    
        </div>
    </div>
</header>
